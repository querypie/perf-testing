# QueryPie ACP 전용 MySQL과 Redis를 실행합니다.
# perf-acp-db VM에서 실행합니다.

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-querypie}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-querypie}
      MYSQL_USER: ${MYSQL_USER:-querypie}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-querypie}
    command:
      - '--character-set-server=utf8mb4'
      - '--collation-server=utf8mb4_unicode_ci'
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
    name: acp_mysql_data
  redis_data:
    name: acp_redis_data
